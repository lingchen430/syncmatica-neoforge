name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download and verify client API dependencies
        shell: pwsh
        run: ./setup-dependencies.ps1
      - name: Build and test
        shell: pwsh
        run: ./gradlew.bat build --console plain
      - name: Upload mod and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncmatica-neoforge-26.1.2
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build/test-results/test/*.xml
